[workspace]
name = "cuttag-project-template"
version = "0.4.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
matplotlib = "3.9.*"
pybigwig = "*"
nextflow = "23.10.1.*"
openjdk = "17.*"
apptainer = "1.3.6.*"

[feature.analysis.dependencies]
samtools = "1.20.*"
bedtools = "2.31.*"
bowtie2 = "2.5.*"
homer = "4.11.*"
deeptools = "3.5.*"
r-base = "4.4.*"
bioconductor-deseq2 = "*"
bioconductor-chipseeker = "*"
bioconductor-clusterprofiler = "*"
"bioconductor-org.hs.eg.db" = "3.20.*"

[environments]
analysis = { features = ["analysis"] }

[tasks]
validate = "python scripts/cuttag.py validate --allow-missing"
plan = "python scripts/cuttag.py plan --stage alignment"
selftest = "python -m unittest discover -s tests -v"
