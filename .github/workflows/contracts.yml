name: Template contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/*.py tests/*.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/cuttag.py validate --allow-missing
